<!DOCTYPE html>
<html lang="eng">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
    <title>Tic Tac Toe</title>
</head>

<body>
    <dialog id="createGame-dialog" closedby="none">
        <form>
            <div class="playerName-div">
                <label for="firstPlayerName-input" class="playerName-label">Player 1 name :</label>
                <input type="text" class="playerName-input" id="firstPlayerName-input" autofocus>
            </div>
            <div class="playerName-div">
                <label for="secondPlayerName-input" class="playerName-label">Player 2 name :</label>
                <input type="text" class="playerName-input" id="secondPlayerName-input">
            </div>
            <button id="cancelDialog-btn">Cancel</button>
            <button id="confirmDialog-btn">Confirm</button>
        </form>
    </dialog>

    <div>
        <p id="result"></p>
        <button id="createNewGame-btn">Create new game</button>

    </div>
    <div class="right-side">
        <h1>Tic Tac Toe</h1>
        <div id="grid">
            <div class="cell" id="cell1"></div>
            <div class="cell" id="cell2"></div>
            <div class="cell" id="cell3"></div>
            <div class="cell" id="cell4"></div>
            <div class="cell" id="cell5"></div>
            <div class="cell" id="cell6"></div>
            <div class="cell" id="cell7"></div>
            <div class="cell" id="cell8"></div>
            <div class="cell" id="cell9"></div>
        </div>

    </div>
</body>

</html>
